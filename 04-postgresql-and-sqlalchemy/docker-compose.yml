services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fastapi_series
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastapi_series"]
      interval: 5s
      timeout: 3s
      retries: 10
